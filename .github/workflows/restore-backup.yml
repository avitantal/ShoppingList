name: Restore DB from Backup

on:
  workflow_dispatch:
    inputs:
      backup_date:
        description: 'תאריך הגיבוי לשחזור (YYYY-MM-DD)'
        required: true
        type: string

permissions:
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: production   # דורש אישור ידני לפני הרצה
    steps:
      - name: Find artifact run ID
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=db-backup-${{ inputs.backup_date }}&per_page=1" \
            --jq '.artifacts[0].workflow_run.id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "❌ לא נמצא גיבוי לתאריך ${{ inputs.backup_date }}"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "✅ נמצא גיבוי ב-run $RUN_ID"

      - name: Download artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ steps.find.outputs.run_id }} \
            --repo ${{ github.repository }} \
            -n db-backup-${{ inputs.backup_date }} \
            -D .

      - name: Restore to Supabase
        run: |
          pg_restore \
            --clean --if-exists --no-owner --no-acl \
            -d "${{ secrets.SUPABASE_DB_URL }}" \
            backup-${{ inputs.backup_date }}.dump
          echo "✅ שחזור הושלם בהצלחה"
