name: Daily DB Backup

on:
  schedule:
    - cron: '0 2 * * *'  # כל לילה 02:00 UTC (05:00 בישראל)
  workflow_dispatch:      # הרצה ידנית מ-GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Set date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: pg_dump
        run: |
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --no-owner --no-acl -Fc \
            -f backup-${{ steps.date.outputs.date }}.dump

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.date.outputs.date }}
          path: backup-*.dump
          retention-days: 30
