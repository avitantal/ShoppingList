name: Refresh product catalog

on:
  # 04:00 UTC = 07:00 Israel — well after the chains publish their daily
  # PriceFull snapshots, before users start shopping.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: refresh-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install --quiet -r scripts/requirements.txt

      - run: python scripts/refresh_catalog.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
