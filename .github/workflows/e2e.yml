name: E2E (Playwright)

# Runs Playwright e2e suite against the dev server.
# Triggered on:
#   - PRs that touch app code, e2e specs, or this workflow (catches regressions before merge)
#   - manual workflow_dispatch (for ad-hoc runs)
# NOT triggered on push to master — deploy.yml owns that path and a green PR
# already covered the change.

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'supabase/migrations/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

# Cancel in-flight runs when a PR is updated.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # App env (read by Vite at dev-server startup)
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Admin env (read by e2e/helpers/supabaseAdmin.ts to provision users + purge data)
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Test users — ensureUser() will create them if missing.
      E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
      E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
      E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
      E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Fail fast if required secrets are missing
        run: |
          missing=()
          for k in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY \
                   E2E_USER_A_EMAIL E2E_USER_A_PASSWORD \
                   E2E_USER_B_EMAIL E2E_USER_B_PASSWORD; do
            if [ -z "${!k}" ]; then missing+=("$k"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "Add them under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run Playwright tests
        # playwright.config.ts's webServer block starts `npm run dev` and waits
        # for http://localhost:5173 before tests begin.
        run: npx playwright test --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results
            test-screenshots
          retention-days: 7
          if-no-files-found: ignore
